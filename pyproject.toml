[project]
name = "agentic-mcp"
version = "0.1.0"
description = "MCP server for chip design: any agent can take RTL from spec to verified layout candidate"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "AgentIC contributors" }]
keywords = ["mcp", "chip-design", "vlsi", "eda", "verilog", "rtl", "gdsii"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
dependencies = [
    "mcp[cli]>=2.3.0",
]

[project.urls]
Homepage = "https://github.com/Vickyrrrrrr/agentic-mcp"
Repository = "https://github.com/Vickyrrrrrr/agentic-mcp"

[project.scripts]
agentic-mcp = "agentic_mcp.server:main"

[dependency-groups]
dev = ["pytest>=9", "pytest-asyncio>=1", "ruff>=0.12"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
